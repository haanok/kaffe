  <style>

const HALF_LIFE_MS = 5 * 60 * 60 * 1000;

// ── Math / helpers ─────────────────────────────────────────────────────────
function activeAt(entries, tMs) {
  let sum = 0;
  for (const e of entries) {
    if (e.time > tMs) continue;
    sum += e.mg * Math.pow(0.5, (tMs - e.time) / HALF_LIFE_MS);
  }
  return sum;
}
function timeBelow(entries, threshold, fromMs) {
  let t = fromMs;
  const end = fromMs + 24 * 60 * 60 * 1000;
  while (t < end) {
    if (activeAt(entries, t) < threshold) return t;
    t += 5 * 60 * 1000;
  }
  return null;
}
function fmtTime(ms) {
  const d = new Date(ms);
  let h = d.getHours(); const m = d.getMinutes();
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${m.toString().padStart(2, '0')} ${ap}`;
}

    { day: 'Mon', mg: 340 },

// ── Haptics (mobile only) ──────────────────────────────────────────────────
// No-op when the API is missing or the device ignores it (most desktops).
function buzz(pattern = 8) {
  try {
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
      navigator.vibrate(pattern);
    }
  } catch {}
}

// ── Storage ────────────────────────────────────────────────────────────────
const STORE_KEY = 'kaffe-log-v1';
const WATER_KEY = 'kaffe-water-log-v1';
function todayKey() { return new Date().toISOString().slice(0, 10); }
function loadEntries() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return [];
    const { date, entries } = JSON.parse(raw);
    return date === todayKey() ? entries : [];
  } catch { return []; }
}
function saveEntries(entries) {
  localStorage.setItem(STORE_KEY, JSON.stringify({ date: todayKey(), entries }));
}
function loadWaters() {
  try {
    const raw = localStorage.getItem(WATER_KEY);
    if (!raw) return [];
    const { date, waters } = JSON.parse(raw);
    return date === todayKey() ? waters : [];
  } catch { return []; }
}
function saveWaters(waters) {
  localStorage.setItem(WATER_KEY, JSON.stringify({ date: todayKey(), waters }));
}
function hydroPoints(waters) {
  return waters.reduce((s, w) => s + 1 + (w.bonus ? 1 : 0), 0);
}

// ── Hooks ──────────────────────────────────────────────────────────────────
function useLiveNow() {
  const [now, setNow] = useState(Date.now);
  useEffect(() => {
    const iv = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(iv);
  }, []);
  return now;
}
function useIsDesktop() {
  const get = () => typeof window !== 'undefined' && window.matchMedia('(min-width: 1024px)').matches;
  const [d, setD] = useState(get);
  useEffect(() => {
    const mql = window.matchMedia('(min-width: 1024px)');
    const h = e => setD(e.matches);
    mql.addEventListener('change', h);
    return () => mql.removeEventListener('change', h);
  }, []);
  return d;
}
function useElementWidth(deps = []) {
  const ref = useRef(null);
  const [w, setW] = useState(0);
  useEffect(() => {
    if (!ref.current) return;
    const el = ref.current;
    const update = () => setW(el.clientWidth);
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, deps);
  return [ref, w];
}
const THEME_KEY = 'kaffe-theme';
function useTheme() {
  const [theme, setTheme] = useState(() => {
    try { return document.documentElement.getAttribute('data-theme') || localStorage.getItem(THEME_KEY) || 'dark'; }
    catch { return 'dark'; }
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'light' ? '#faf5ea' : '#13110e');
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  }, [theme]);
  const toggle = useCallback(() => setTheme(t => t === 'dark' ? 'light' : 'dark'), []);
  return [theme, toggle];
}

function ThemeToggle({ size = 18 }) {
  const [theme, toggle] = useTheme();
  const isLight = theme === 'light';
  const isDesktop = useIsDesktop();
  const handle = () => { if (!isDesktop) buzz(6); toggle(); };

    <button
      onClick={handle}
      aria-label={isLight ? 'Switch to dark theme' : 'Switch to light theme'}
      title={isLight ? 'Switch to dark theme' : 'Switch to light theme'}

// ── Decay curve ────────────────────────────────────────────────────────────
function DecayCurve({ entries, now, width, height = 150, showLabels = true }) {
  const earliest = entries.length ? Math.min(...entries.map(e => e.time)) - 30 * 60 * 1000 : now - 60 * 60 * 1000;
  const start = Math.min(earliest, now - 2 * 60 * 60 * 1000);
  const end = now + 12 * 60 * 60 * 1000;
  const pts = [];
  let peak = 0;
  for (let t = start; t <= end; t += 5 * 60 * 1000) {
    let v = 0;
    for (const e of entries) { if (e.time <= t) v += e.mg * Math.pow(0.5, (t - e.time) / HALF_LIFE_MS); }
    if (v > peak) peak = v;
    pts.push({ t, v });
  }
  const yMax = Math.max(250, peak * 1.15, 440);
  const pl = 8, pr = 8, pt = 14, pb = 24;
  const iw = width - pl - pr, ih = height - pt - pb;
  const xOf = t => pl + ((t - start) / (end - start)) * iw;
  const yOf = v => pt + (1 - Math.min(v, yMax) / yMax) * ih;
  let line = '', area = '';
  pts.forEach((p, i) => {
    const x = xOf(p.t).toFixed(1), y = yOf(p.v).toFixed(1);
    if (i === 0) { line += `M ${x} ${y}`; area += `M ${x} ${(pt + ih).toFixed(1)} L ${x} ${y}`; }
    else { line += ` L ${x} ${y}`; area += ` L ${x} ${y}`; }
  });
  area += ` L ${xOf(end).toFixed(1)} ${(pt + ih).toFixed(1)} Z`;
  const limitY = yOf(400), sleepY = yOf(50), nowX = xOf(now);
  const hourTicks = [];
  for (let h = Math.ceil(start / 3600000); h <= Math.floor(end / 3600000); h += 2) {
    const t = h * 3600000, d = new Date(t);
    let hr = d.getHours(); const ap = hr >= 12 ? 'p' : 'a';
    hr = hr % 12; if (hr === 0) hr = 12;
    hourTicks.push({ x: xOf(t), label: `${hr}${ap}` });
  }
  const gradId = useMemo(() => 'cg-' + Math.random().toString(36).slice(2, 8), []);
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={T.accent} stopOpacity="0.08" />
          <stop offset="100%" stopColor={T.accent} stopOpacity="0" />
        </linearGradient>
      </defs>
      <line x1={pl} x2={width - pr} y1={limitY} y2={limitY} stroke={T.danger} strokeOpacity="0.45" strokeWidth="1" />
      {showLabels && <text x={width - pr} y={limitY - 4} textAnchor="end" fill={T.danger} fillOpacity="0.7" fontSize="9" fontFamily={T.fontMono} letterSpacing="0.05em">400 MG · DAILY MAX</text>}
      <line x1={pl} x2={width - pr} y1={sleepY} y2={sleepY} stroke={T.muted} strokeOpacity="0.5" strokeWidth="1" />
      {showLabels && <text x={pl} y={sleepY - 4} textAnchor="start" fill={T.muted} fontSize="9" fontFamily={T.fontMono} letterSpacing="0.05em">50 MG · SLEEP-OK</text>}
      <path d={area} fill={`url(#${gradId})`} />
      <path d={line} fill="none" stroke={T.accent} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
      {entries.map((e, i) => {
        const ex = xOf(e.time), ey = yOf(e.mg);
        return <g key={i}><circle cx={ex} cy={ey} r="2" fill={T.accent} /><circle cx={ex} cy={ey} r="4" fill="none" stroke={T.accent} strokeOpacity="0.25" /></g>;
      })}
      <line x1={nowX} x2={nowX} y1={pt - 4} y2={pt + ih} stroke={T.fg} strokeOpacity="0.5" strokeWidth="1" strokeDasharray="3 3" />
      <circle cx={nowX} cy={yOf(activeAt(entries, now))} r="4" fill={T.bg} stroke={T.accent} strokeWidth="2" />
      {hourTicks.map((t, i) => (
        <g key={i}>
          <line x1={t.x} x2={t.x} y1={pt + ih} y2={pt + ih + 3} stroke={T.muted} strokeOpacity="0.5" />
          <text x={t.x} y={pt + ih + 14} textAnchor="middle" fill={T.muted} fontSize="9" fontFamily={T.fontMono} letterSpacing="0.04em">{t.label}</text>
        </g>
      ))}
    </svg>
  );
}

const PORTIONS = [

  { value: 1,    label: '1' },

];
function portionLabel(amount) {
  const p = PORTIONS.find(p => Math.abs(p.value - amount) < 0.001);
  if (p) return p.label;
  return amount.toFixed(2).replace(/\.?0+$/, '');
}
function AmountBody({ d, amount, setAmount, onClose, onConfirm }) {
  const mg = Math.round(d.mg * amount);

  const lastDetentRef = useRef(Math.floor(amount * 4));
  const onSliderChange = e => {
    const v = Number(e.target.value);
    const d4 = Math.floor(v * 4);
    if (d4 !== lastDetentRef.current) {
      lastDetentRef.current = d4;
      buzz(4);

    setAmount(v);
  };
  return (
    <>
      <div style={{ padding: '14px 22px 4px', display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{ width: 44, height: 44, borderRadius: T.radius, border: T.cardBorder, display: 'flex', alignItems: 'center', justifyContent: 'center', color: T.accent, flexShrink: 0 }}><DrinkGlyph cat={d.cat} size={22} /></div>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div style={{ padding: '18px 22px 6px', fontFamily: T.fontMono, fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: T.muted }}>How much?</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6, padding: '8px 22px 0' }}>
        {PORTIONS.map(p => {
          const sel = Math.abs(p.value - amount) < 0.001;
          return (
            <button key={p.value} onClick={() => { buzz(8); lastDetentRef.current = Math.floor(p.value * 4); setAmount(p.value); }} style={{ padding: '16px 8px', borderRadius: T.radius, border: sel ? `1px solid ${T.accent}` : T.cardBorder, background: sel ? 'var(--accent-tint)' : 'transparent', color: sel ? T.accent : T.fg, fontFamily: T.fontDisplay, fontSize: 22, fontWeight: T.displayWeight, letterSpacing: T.displayTracking, cursor: 'pointer', transition: 'all 0.15s' }}>
              {p.label}
            </button>
          );
        })}
      </div>
      <div style={{ padding: '18px 22px 4px', display: 'flex', alignItems: 'center', gap: 10 }}>
        <input type="range" min="0.1" max="3" step="0.05" value={amount} onChange={onSliderChange} style={{ flex: 1 }} />
        <span style={{ fontFamily: T.fontMono, fontSize: 11, color: T.muted, letterSpacing: '0.04em', minWidth: 44, textAlign: 'right' }}>×{amount.toFixed(2).replace(/\.?0+$/, '')}</span>
      </div>
      <div style={{ padding: '14px 22px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', borderTop: T.divider, marginTop: 4, paddingTop: 14 }}>

// ══════════════════════════════════════════════════════════════════════════
// HYDRO — water glasses + reward animation
// ══════════════════════════════════════════════════════════════════════════
function HydroCard({ waters, addWater }) {
  const [phase, setPhase] = useState('idle'); // idle | filling | bursting | draining
  const [droplets, setDroplets] = useState([]);
  const [pendingBonus, setPendingBonus] = useState(false);
  const [displayPoints, setDisplayPoints] = useState(() => hydroPoints(waters));
  const [pulseKey, setPulseKey] = useState(0);
  const isDesktop = useIsDesktop();
  const timers = useRef([]);

  const points = hydroPoints(waters);
  const glasses = waters.length;
  const bonusCount = waters.filter(w => w.bonus).length;

  useEffect(() => {
    if (phase === 'idle') setDisplayPoints(points);
  }, [points, phase]);

  useEffect(() => () => { timers.current.forEach(clearTimeout); }, []);

  const schedule = (fn, ms) => {
    const id = setTimeout(fn, ms);
    timers.current.push(id);
  };

  const handleClick = () => {
    if (phase !== 'idle') return;
    const rec = addWater();
    const bonus = !!(rec && rec.bonus);
    if (!isDesktop) buzz(bonus ? [12, 50, 28] : 14);
    setPendingBonus(bonus);
    setPhase('filling');

    const dropCount = bonus ? 11 : 7;
    const drops = Array.from({ length: dropCount }, (_, i) => {
      const angle = (Math.PI * (0.15 + 0.7 * (i / Math.max(dropCount - 1, 1)))) - Math.PI * 0.075;
      const speed = 55 + Math.random() * 50;
      const dx = Math.cos(angle) * speed * (Math.random() < 0.5 ? -1 : 1);
      const dy = 70 + Math.random() * 55;
      const peak = -(32 + Math.random() * 24);
      const size = 4 + Math.random() * 4;
      return {
        id: 'd' + Date.now() + '-' + i,
        dx: `${dx.toFixed(1)}px`,
        dy: `${dy.toFixed(1)}px`,
        peak: `${peak.toFixed(1)}px`,
        size,
        delay: Math.random() * 160,
        bonus,
      };
    });

    schedule(() => { setPhase('bursting'); setDroplets(drops); }, 360);
    schedule(() => {
      setDisplayPoints(p => p + (bonus ? 2 : 1));
      setPulseKey(k => k + 1);
    }, 820);
    schedule(() => setPhase('draining'), 1040);
    schedule(() => { setPhase('idle'); setDroplets([]); }, 1500);
  };

  const BTN = 56; // circle button diameter
  const fillHeight = phase === 'filling' || phase === 'bursting' ? '100%' : '0%';
  const fillTransition = phase === 'filling' ? 'height 580ms cubic-bezier(0.22, 1, 0.36, 1)'
    : phase === 'draining' ? 'height 420ms cubic-bezier(0.55, 0, 0.7, 0.2), opacity 420ms ease-out'
    : 'none';
  const fillOpacity = phase === 'draining' ? 0.45 : 1;
  const accentNow = pendingBonus && phase !== 'idle' ? T.bonus : T.water;

  return (
    <Card padding={14}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
            <div style={{ fontFamily: T.fontMono, fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: T.muted, fontWeight: 500 }}>Hydro</div>
            {bonusCount > 0 && (
              <div style={{ fontFamily: T.fontMono, fontSize: 9, letterSpacing: '0.14em', textTransform: 'uppercase', color: T.bonus, fontWeight: 600 }}>
                {bonusCount} bonus
              </div>
            )}
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span
              key={pulseKey}
              style={{
                display: 'inline-block',
                fontFamily: T.fontDisplay,
                fontSize: 30,
                lineHeight: 1,
                color: accentNow,
                fontWeight: T.displayWeight,
                letterSpacing: T.displayTracking,
                fontFeatureSettings: '"tnum"',
                transition: 'color 0.3s ease',
                animation: pulseKey > 0 ? 'kaffePointPulse 420ms cubic-bezier(0.34, 1.56, 0.64, 1)' : 'none',
                transformOrigin: 'left center',
              }}
            >{displayPoints}</span>
            <span style={{ fontFamily: T.fontMono, fontSize: 10.5, color: T.muted, letterSpacing: '0.04em' }}>
              {glasses === 0 ? 'tap to start' : `${glasses} ${glasses === 1 ? 'glass' : 'glasses'}`}
            </span>
          </div>
        </div>

        {/* Circle button — water fills inside, droplets burst outward */}
        <div style={{ position: 'relative', width: BTN, height: BTN, flexShrink: 0 }}>
          {/* Droplet burst layer (sibling, so droplets aren't clipped by button overflow:hidden) */}
          <div aria-hidden style={{ position: 'absolute', left: '50%', top: '50%', width: 0, height: 0, pointerEvents: 'none', zIndex: 4 }}>
            {droplets.map(d => (
              <div
                key={d.id}
                style={{
                  position: 'absolute',
                  left: -d.size / 2,
                  top: -d.size / 2,
                  width: d.size,
                  height: d.size,
                  borderRadius: '50% 50% 50% 50% / 60% 60% 40% 40%',
                  background: d.bonus ? T.bonus : T.water,
                  boxShadow: `0 0 6px ${alpha(d.bonus ? T.bonus : T.water, 53)}`,
                  opacity: 0,
                  ['--dx']: d.dx,
                  ['--dy']: d.dy,
                  ['--peak']: d.peak,
                  animation: `kaffeDroplet 900ms cubic-bezier(0.22, 0.61, 0.36, 1) ${d.delay}ms forwards`,
                }}
              />
            ))}
          </div>

          <button
            onClick={handleClick}
            disabled={phase !== 'idle'}
            aria-label="Add glass of water"
            title={phase === 'idle' ? 'Add a glass of water' : ''}
            style={{
              position: 'relative',
              overflow: 'hidden',
              width: BTN, height: BTN,
              borderRadius: '50%',
              background: T.track,
              border: `1px solid ${alpha(T.water, 33)}`,
              cursor: phase === 'idle' ? 'pointer' : 'default',
              color: accentNow,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              padding: 0,
              transition: 'border-color 0.2s ease, transform 0.1s, box-shadow 0.25s ease',
              boxShadow: phase === 'bursting' ? `0 0 0 4px ${alpha(accentNow, 25)}` : 'none',
            }}
            onMouseDown={e => { if (phase === 'idle') e.currentTarget.style.transform = 'scale(0.94)'; }}
            onMouseUp={e => e.currentTarget.style.transform = 'scale(1)'}
            onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
          >
            {/* Water fill inside the circle */}
            <div
              aria-hidden
              style={{
                position: 'absolute',
                left: 0, right: 0, bottom: 0,
                height: fillHeight,
                background: pendingBonus
                  ? `linear-gradient(180deg, ${alpha(T.bonus, 40)} 0%, ${alpha(T.water, 53)} 30%, ${alpha(T.water, 80)} 100%)`
                  : `linear-gradient(180deg, ${alpha(T.water, 33)} 0%, ${alpha(T.water, 53)} 30%, ${alpha(T.water, 80)} 100%)`,
                transition: fillTransition,
                opacity: fillOpacity,
                pointerEvents: 'none',
                zIndex: 0,
              }}
            />
            {/* Water surface wobble */}
            {(phase === 'filling' || phase === 'bursting') && (
              <div aria-hidden style={{ position: 'absolute', left: 0, right: 0, bottom: 'calc(100% - 3px)', height: 0, pointerEvents: 'none', zIndex: 1 }}>
                <div style={{
                  position: 'absolute', left: -8, right: -8, top: -2, height: 5,
                  background: `linear-gradient(180deg, transparent, ${T.water})`,
                  opacity: 0.6,
                  animation: 'kaffeWaterWobble 1.4s ease-in-out infinite',
                  borderRadius: '50%',
                }} />
              </div>
            )}
            {/* Glyph */}
            <span style={{ position: 'relative', zIndex: 2, display: 'inline-flex' }}>
              <WaterDropGlyph size={22} />
            </span>
          </button>
        </div>
      </div>
    </Card>
  );
}

// MOBILE LAYOUT
// ══════════════════════════════════════════════════════════════════════════
function MobileApp({ entries, addEntry, removeEntry, updateEntryTime, waters, addWater, removeWater, updateWaterTime, now, setBrowseOpen, setPendingDrink }) {
  const [width, setWidth] = useState(Math.min(window.innerWidth, 480));
  useEffect(() => {
    const onResize = () => setWidth(Math.min(window.innerWidth, 480));
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const total = entries.reduce((s, e) => s + e.mg, 0);
  const kcal = entries.reduce((s, e) => s + e.kcal, 0);
  const active = Math.round(activeAt(entries, now));
  const safeAt = timeBelow(entries, 50, now);

  let coach;
  if (total === 0) coach = "Fresh day. Tap a drink when you're ready.";
  else if (total < 200) coach = "Plenty of room left today.";
  else if (total < 350) coach = "Solid pace — maybe make the next one tea.";
  else if (total < 500) coach = "Right at the daily limit. Body is fully fueled.";
  else coach = "Big day on the beans. Water from here.";

  const h = new Date(now).getHours();
  const greeting = h < 5 ? "Late one" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 21 ? "Good evening" : "Up late";

  const QUICK = ['drip', 'dbl-espresso', 'latte', 'matcha', 'monster-zero', 'red-bull'];

  const curveWidth = width - 36 - 32;
  const headlineColor = total > 400 ? T.danger : T.fg;
  const overColor = total < 300 ? T.ok : total < 400 ? T.warn : T.danger;

  return (
    <div className="kaffe-mobile" style={{ maxWidth: 480, margin: '0 auto', padding: '24px 18px 60px', display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ paddingTop: 6, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12 }}>
        <div>
          <div style={{ fontFamily: T.fontMono, fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: T.muted, marginBottom: 4 }}>{greeting.toUpperCase()}</div>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 30, lineHeight: 1.05, color: T.fg, fontWeight: T.displayWeight, letterSpacing: T.displayTracking }}>Today</div>
        </div>
        <ThemeToggle />
      </div>

      <Card padding={16}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
          <div>
            <div style={{ fontFamily: T.fontMono, fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: T.muted, marginBottom: 4 }}>Today's intake</div>
            <div style={{ fontFamily: T.fontDisplay, fontSize: 38, lineHeight: 1, color: headlineColor, fontWeight: T.displayWeight, letterSpacing: T.displayTracking, fontFeatureSettings: '"tnum"' }}>{total}</div>
            <div style={{ fontFamily: T.fontMono, fontSize: 10, color: T.muted, marginTop: 4, letterSpacing: '0.04em' }}>of 400 mg</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontFamily: T.fontMono, fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: T.muted, marginBottom: 4 }}>Active now</div>
            <div style={{ fontFamily: T.fontDisplay, fontSize: 28, lineHeight: 1, color: T.fg, fontWeight: T.displayWeight, letterSpacing: T.displayTracking, fontFeatureSettings: '"tnum"' }}>{active}</div>
            <div style={{ fontFamily: T.fontMono, fontSize: 10, color: T.muted, marginTop: 4, letterSpacing: '0.04em' }}>mg in body</div>
          </div>
        </div>
        <DecayCurve entries={entries} now={now} width={curveWidth} height={150} />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10, paddingTop: 10, borderTop: T.divider }}>
          <span style={{ fontFamily: T.fontBody, fontSize: 12.5, color: T.muted, lineHeight: 1.4, flex: 1, paddingRight: 12 }}>{coach}</span>
          <div style={{ fontFamily: T.fontMono, fontSize: 9.5, letterSpacing: '0.16em', textTransform: 'uppercase', color: overColor, fontWeight: 600, whiteSpace: 'nowrap' }}>
            {total === 0 ? 'Untouched' : total < 400 ? `${Math.round((total/400) * 100)}% used` : `+${total - 400} mg over`}
          </div>
        </div>
      </Card>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
        <Card padding={12}>
          <div style={{ fontFamily: T.fontMono, fontSize: 9, letterSpacing: '0.12em', textTransform: 'uppercase', color: T.muted, marginBottom: 4 }}>Calories</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
            <span style={{ fontFamily: T.fontDisplay, fontSize: 22, lineHeight: 1, color: T.fg, fontWeight: T.displayWeight, fontFeatureSettings: '"tnum"' }}>{kcal}</span>
            <span style={{ fontFamily: T.fontMono, fontSize: 10, color: T.muted }}>kcal</span>
          </div>
        </Card>
        <Card padding={12}>
          <div style={{ fontFamily: T.fontMono, fontSize: 9, letterSpacing: '0.12em', textTransform: 'uppercase', color: T.muted, marginBottom: 4 }}>Drinks</div>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 22, lineHeight: 1, color: T.fg, fontWeight: T.displayWeight, fontFeatureSettings: '"tnum"' }}>{entries.length}</div>
        </Card>
        <Card padding={12}>
          <div style={{ fontFamily: T.fontMono, fontSize: 9, letterSpacing: '0.12em', textTransform: 'uppercase', color: T.muted, marginBottom: 4 }}>Sleep-safe</div>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 18, lineHeight: 1, color: T.fg, fontWeight: T.displayWeight }}>{safeAt ? fmtTime(safeAt) : '—'}</div>
        </Card>
      </div>

      <HydroCard waters={waters} addWater={addWater} />

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 4px' }}>
          <div style={{ fontFamily: T.fontMono, fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: T.muted, fontWeight: 500 }}>Quick log</div>
          <button onClick={() => { buzz(6); setBrowseOpen(true); }} style={{ background: 'none', border: 'none', cursor: 'pointer', fontFamily: T.fontMono, fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: T.accent, padding: '4px 0' }}>Browse all →</button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          {QUICK.map(id => {
            const d = DRINK_BY_ID[id];
            return (
              <button key={id} onClick={() => { buzz(8); setPendingDrink(id); }}
                style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', background: T.card, border: T.cardBorder, borderRadius: T.radius, cursor: 'pointer', color: T.fg, textAlign: 'left', transition: 'transform 0.1s' }}
                onMouseDown={e => e.currentTarget.style.transform = 'scale(0.97)'}
                onMouseUp={e => e.currentTarget.style.transform = 'scale(1)'}
                onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}>
                <div style={{ width: 36, height: 36, borderRadius: T.radius, border: T.cardBorder, display: 'flex', alignItems: 'center', justifyContent: 'center', color: T.accent, flexShrink: 0 }}><DrinkGlyph cat={d.cat} /></div>
                <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0 }}>
                  <span style={{ fontFamily: T.fontBody, fontSize: 13, color: T.fg, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{d.name}</span>
                  <span style={{ fontFamily: T.fontMono, fontSize: 10, color: T.muted, letterSpacing: '0.04em' }}>{d.mg} mg · {d.kcal} kcal</span>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ padding: '0 4px', fontFamily: T.fontMono, fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: T.muted, fontWeight: 500 }}>Today's log</div>
        {entries.length === 0 && waters.length === 0 ? (
          <Card padding={20} style={{ textAlign: 'center' }}>
            <span style={{ fontFamily: T.fontBody, fontSize: 13, color: T.muted }}>Nothing logged yet today.</span>
          </Card>
        ) : (
          <Card padding={0}>
            {[
              ...entries.map(e => ({ ...e, _kind: 'coffee' })),
              ...waters.map(w => ({ ...w, _kind: 'water' })),
            ].sort((a, b) => b.time - a.time).map((row, i, arr) => {
              const t = new Date(row.time);
              const timeVal = `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;
              const isWater = row._kind === 'water';
              if (isWater) {
                const iconColor = row.bonus ? T.bonus : T.water;
                return (
                  <div key={row.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', borderBottom: i < arr.length - 1 ? T.divider : 'none' }}>
                    <div style={{ width: 36, height: 36, borderRadius: T.radius, border: `1px solid ${alpha(iconColor, 25)}`, display: 'flex', alignItems: 'center', justifyContent: 'center', color: iconColor, flexShrink: 0 }}><WaterDropGlyph /></div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontFamily: T.fontBody, fontSize: 13, fontWeight: 500, color: T.fg, marginBottom: 4, display: 'flex', alignItems: 'center', gap: 6 }}>
                        <span>Water</span>
                        <span style={{ fontFamily: T.fontMono, fontSize: 10, color: iconColor, border: `1px solid ${alpha(iconColor, 33)}`, padding: '0 5px', borderRadius: T.radius, letterSpacing: '0.04em' }}>{row.bonus ? '+2 BONUS' : '+1'}</span>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                        <input
                          type="time"
                          value={timeVal}
                          onChange={ev => updateWaterTime(row.id, ev.target.value)}
                          style={{ fontFamily: T.fontMono, fontSize: 10, color: iconColor, background: T.track, border: 'none', borderRadius: T.radius, padding: '2px 6px', cursor: 'pointer', letterSpacing: '0.04em', outline: 'none', width: 72 }}
                        />
                        <span style={{ fontFamily: T.fontMono, fontSize: 10, color: T.muted, letterSpacing: '0.04em' }}>1 glass</span>
                      </div>
                    </div>
                    <button onClick={() => removeWater(row.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: T.muted, padding: 6 }}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
                    </button>
                  </div>
                );
              }
              const d = DRINK_BY_ID[row.drink];
              return (
                <div key={row.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', borderBottom: i < arr.length - 1 ? T.divider : 'none' }}>
                  <div style={{ width: 36, height: 36, borderRadius: T.radius, border: T.cardBorder, display: 'flex', alignItems: 'center', justifyContent: 'center', color: T.accent, flexShrink: 0 }}><DrinkGlyph cat={d.cat} /></div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: T.fontBody, fontSize: 13, fontWeight: 500, color: T.fg, marginBottom: 4, display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span>{d.name}</span>
                      {row.amount && Math.abs(row.amount - 1) > 0.001 && (
                        <span style={{ fontFamily: T.fontMono, fontSize: 10, color: T.accent, border: `1px solid ${alpha(T.accent, 33)}`, padding: '0 5px', borderRadius: T.radius, letterSpacing: '0.04em' }}>{portionLabel(row.amount)}×</span>
                      )}
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <input
                        type="time"
                        value={timeVal}
                        onChange={ev => updateEntryTime(row.id, ev.target.value)}
                        style={{ fontFamily: T.fontMono, fontSize: 10, color: T.accent, background: T.track, border: 'none', borderRadius: T.radius, padding: '2px 6px', cursor: 'pointer', letterSpacing: '0.04em', outline: 'none', width: 72 }}
                      />
                      <span style={{ fontFamily: T.fontMono, fontSize: 10, color: T.muted, letterSpacing: '0.04em' }}>{row.mg} mg · {row.kcal} kcal</span>
                    </div>
                  </div>
                  <button onClick={() => removeEntry(row.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: T.muted, padding: 6 }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
                  </button>
                </div>
              );
            })}
          </Card>
        )}
      </div>
    </div>
  );
}

function DLabel({ children, style = {} }) {
  return <div style={{ fontFamily: T.fontMono, fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: T.muted, fontWeight: 500, ...style }}>{children}</div>;
}

function StatBlock({ label, value, unit, big = false, live = false, over = false, numeric = true }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <DLabel>{label}</DLabel>
        {live && <span style={{ width: 5, height: 5, borderRadius: 3, background: T.accent, animation: 'kaffePulse 2s ease-out infinite', color: T.accent }} />}
      </div>
      <div style={{ fontFamily: T.fontDisplay, fontSize: big ? 56 : 38, lineHeight: 1, color: over ? T.danger : T.fg, fontWeight: T.displayWeight, letterSpacing: T.displayTracking, fontFeatureSettings: numeric ? '"tnum"' : 'normal' }}>{value}</div>
      <div style={{ fontFamily: T.fontMono, fontSize: 11, color: T.muted, letterSpacing: '0.04em' }}>{unit}</div>
    </div>
  );
}

function HeroGraph({ entries, now }) {
  const [ref, w] = useElementWidth();
  const total = entries.reduce((s, e) => s + e.mg, 0);
  const active = Math.round(activeAt(entries, now));
  const safeAt = timeBelow(entries, 50, now);
  const pctOfLimit = Math.round((total / 400) * 100);
  return (
    <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 28 }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr 1fr 1fr', gap: 28, marginBottom: 24 }}>
        <StatBlock label="Today's intake" value={total} unit={`of 400 mg · ${pctOfLimit}%`} big over={total > 400} />
        <StatBlock label="Active in body" value={active} unit="mg right now" live />
        <StatBlock label="Sleep-safe at" value={safeAt ? fmtTime(safeAt) : '—'} unit="under 50 mg" numeric={false} />
        <StatBlock label="Half-life" value="~5h" unit="metabolic rate" numeric={false} />
      </div>
      <div ref={ref}>
        {w > 0 && <DecayCurve entries={entries} now={now} width={w} height={300} />}
      </div>
    </div>
  );
}

function CoachBanner({ entries }) {
  const total = entries.reduce((s, e) => s + e.mg, 0);
  let line, label;
  if (total === 0) { label = 'Fresh day'; line = "Tap a drink to log when you're ready."; }
  else if (total < 200) { label = 'Cruising'; line = "Plenty of room left. Your next coffee won't push you near the limit."; }
  else if (total < 350) { label = 'Steady'; line = "Solid pace — consider tea or decaf for the next one."; }
  else if (total < 500) { label = 'At the limit'; line = "You're at your daily cap of 400 mg. Body is fully fueled."; }
  else { label = 'Over the line'; line = "Big day. Water from here to be kind to your sleep tonight."; }
  return (
    <div style={{ padding: '14px 22px', border: T.coachBorder, borderRadius: T.radius, display: 'flex', alignItems: 'center', gap: 18 }}>
      <DLabel style={{ color: T.accent }}>Coach · {label}</DLabel>
      <span style={{ fontFamily: T.fontBody, fontSize: 13.5, color: T.fg, lineHeight: 1.5 }}>{line}</span>
    </div>
  );
}

function QuickLogDesktop({ onPick, onBrowse, columns = 2 }) {
  const QUICK = ['drip', 'dbl-espresso', 'latte', 'matcha', 'cold-brew', 'monster-zero'];
  return (
    <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 20 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
        <DLabel>Quick log</DLabel>
        <button onClick={onBrowse} style={{ background: 'none', border: 'none', cursor: 'pointer', fontFamily: T.fontMono, fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: T.accent, padding: 0 }}>Browse catalog →</button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: `repeat(${columns}, 1fr)`, gap: 10 }}>
        {QUICK.map(id => {
          const d = DRINK_BY_ID[id];
          return (
            <button key={id} onClick={() => onPick(id)}
              style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 10, padding: '14px', background: 'transparent', border: T.cardBorder, borderRadius: T.radius, cursor: 'pointer', color: T.fg, textAlign: 'left', transition: 'background 0.15s, border-color 0.15s' }}
              onMouseEnter={e => e.currentTarget.style.background = T.track}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              <div style={{ color: T.accent }}><DrinkGlyph cat={d.cat} size={22} /></div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4, width: '100%' }}>
                <div style={{ fontFamily: T.fontBody, fontSize: 13, color: T.fg, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{d.name}</div>

          );

      </div>
    </div>

}

  const merged = [
    ...entries.map(e => ({ ...e, _kind: 'coffee' })),
    ...(waters || []).map(w => ({ ...w, _kind: 'water' })),
  ].sort((a, b) => b.time - a.time);
  const drinkCount = entries.length;
  const glassCount = (waters || []).length;
  const summary = [
    drinkCount > 0 && `${drinkCount} drink${drinkCount === 1 ? '' : 's'}`,
    glassCount > 0 && `${glassCount} glass${glassCount === 1 ? '' : 'es'}`,

  return (
    <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 0 }}>

        <DLabel>Today's log</DLabel>
        <span style={{ fontFamily: T.fontMono, fontSize: 11, color: T.muted }}>{summary}</span>

      {merged.length === 0 ? (
        <div style={{ padding: 32, textAlign: 'center', fontFamily: T.fontBody, fontSize: 13, color: T.muted }}>Nothing logged yet.</div>
      ) : merged.map((row, i, arr) => {
        const t = new Date(row.time);
        const timeVal = `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;

          const iconColor = row.bonus ? T.bonus : T.water;

            <div key={row.id} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 22px', borderBottom: i < arr.length - 1 ? T.divider : 'none' }}>

              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: T.fontBody, fontSize: 13.5, color: T.fg, fontWeight: 500, marginBottom: 4, display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span>Water</span>
                  <span style={{ fontFamily: T.fontMono, fontSize: 10, color: iconColor, border: `1px solid ${alpha(iconColor, 33)}`, padding: '0 5px', borderRadius: T.radius, letterSpacing: '0.04em' }}>{row.bonus ? '+2 BONUS' : '+1'}</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <input type="time" value={timeVal} onChange={ev => updateWaterTime(row.id, ev.target.value)}
                    style={{ fontFamily: T.fontMono, fontSize: 11, color: iconColor, background: T.track, border: 'none', borderRadius: T.radius, padding: '2px 8px', cursor: 'pointer', letterSpacing: '0.04em', outline: 'none', width: 84 }} />
                  <span style={{ fontFamily: T.fontMono, fontSize: 11, color: T.muted, letterSpacing: '0.04em' }}>1 glass</span>
                </div>

              <button onClick={() => removeWater(row.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: T.muted, padding: 4 }}>

              </button>
            </div>

        const d = DRINK_BY_ID[row.drink];
        return (
          <div key={row.id} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 22px', borderBottom: i < arr.length - 1 ? T.divider : 'none' }}>
            <div style={{ color: T.accent, flexShrink: 0 }}><DrinkGlyph cat={d.cat} size={22} /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontFamily: T.fontBody, fontSize: 13.5, color: T.fg, fontWeight: 500, marginBottom: 4, display: 'flex', alignItems: 'center', gap: 8 }}>
                <span>{d.name}</span>
                {row.amount && Math.abs(row.amount - 1) > 0.001 && (
                  <span style={{ fontFamily: T.fontMono, fontSize: 10, color: T.accent, border: `1px solid ${alpha(T.accent, 33)}`, padding: '0 5px', borderRadius: T.radius, letterSpacing: '0.04em' }}>{portionLabel(row.amount)}×</span>
                )}
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <input type="time" value={timeVal} onChange={ev => updateEntryTime(row.id, ev.target.value)}
                  style={{ fontFamily: T.fontMono, fontSize: 11, color: T.accent, background: T.track, border: 'none', borderRadius: T.radius, padding: '2px 8px', cursor: 'pointer', letterSpacing: '0.04em', outline: 'none', width: 84 }} />
                <span style={{ fontFamily: T.fontMono, fontSize: 11, color: T.muted, letterSpacing: '0.04em' }}>{row.mg} mg · {row.kcal} kcal</span>

function StatsStrip({ entries }) {
  const kcal = entries.reduce((s, e) => s + e.kcal, 0);
  const total = entries.reduce((s, e) => s + e.mg, 0);
  const avgPerDrink = entries.length ? Math.round(total / entries.length) : 0;
  const stats = [
    { label: 'Drinks',      value: entries.length, unit: null },
    { label: 'Calories',    value: kcal, unit: 'kcal' },
    { label: 'Avg / drink', value: avgPerDrink, unit: 'mg' },
    { label: 'Daily limit', value: 400, unit: 'mg' },
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
      {stats.map((s, i) => (
        <div key={i} style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 20 }}>
          <DLabel>{s.label}</DLabel>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 32, color: T.fg, fontWeight: T.displayWeight, marginTop: 8, lineHeight: 1 }}>
            {s.value}{s.unit && <span style={{ fontFamily: T.fontMono, fontSize: 12, color: T.muted, marginLeft: 6 }}>{s.unit}</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

function ThisWeekCard({ entries }) {
  const data = useMemo(() => {
    const w = makeWeekHistory();
    const todayTotal = entries.reduce((s, e) => s + e.mg, 0);
    w[w.length - 1] = { ...w[w.length - 1], mg: todayTotal };
    return w;
  }, [entries]);
  const avg = Math.round(data.reduce((s, d) => s + d.mg, 0) / data.length);
  const max = Math.max(400, ...data.map(d => d.mg)) * 1.1;
  const W = 260, H = 96;
  const barW = (W - 4) / data.length - 6;
  return (
    <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 20 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14 }}>
        <DLabel>This week</DLabel>
        <span style={{ fontFamily: T.fontMono, fontSize: 11, color: T.muted, letterSpacing: '0.04em' }}>avg {avg} mg/day</span>
      </div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: 'block', width: '100%' }}>
        {(() => {
          const y = (1 - 400 / max) * (H - 18);
          return <line x1="0" x2={W} y1={y} y2={y} stroke={T.danger} strokeOpacity="0.4" strokeDasharray="2 4" strokeWidth="1" />;
        })()}
        {data.map((d, i) => {
          const v = d.mg;
          const h = (v / max) * (H - 18);
          const x = 2 + i * ((W - 4) / data.length) + 3;
          const y = H - 18 - h;
          const isLast = i === data.length - 1;
          const fill = v > 400 ? T.danger : (isLast ? T.accent : T.bar);
          return (
            <g key={i}>
              <rect x={x} y={y} width={barW} height={h} rx={1} fill={fill} opacity={isLast ? 1 : 0.85} />
              <text x={x + barW/2} y={H - 4} textAnchor="middle" fill={isLast ? T.fg : T.muted} fontSize="9" fontFamily={T.fontMono} letterSpacing="0.06em">{d.day.toUpperCase()}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function SleepCard({ entries, now }) {
  const bedtime = useMemo(() => {
    const d = new Date(now);
    d.setHours(23, 0, 0, 0);
    if (d.getTime() < now) d.setDate(d.getDate() + 1);
    return d.getTime();
  }, [now]);
  const atBed = Math.round(activeAt(entries, bedtime));
  let verdict, color;
  if (atBed < 30)        { verdict = "You'll sleep fine.";   color = T.ok; }
  else if (atBed < 80)   { verdict = 'Light sleep risk.';    color = T.warn; }
  else if (atBed < 150)  { verdict = 'Rough sleep ahead.';   color = T.warn; }
  else                   { verdict = 'Wired.';               color = T.danger; }
  return (
    <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 20 }}>
      <DLabel style={{ marginBottom: 10 }}>Tonight · 11:00 pm</DLabel>
      <div style={{ fontFamily: T.fontDisplay, fontSize: 44, lineHeight: 1, color, fontWeight: T.displayWeight, letterSpacing: T.displayTracking, marginBottom: 6 }}>
        {atBed}<span style={{ fontFamily: T.fontMono, fontSize: 14, color: T.muted, marginLeft: 6, letterSpacing: '0.04em' }}>mg</span>
      </div>
      <div style={{ fontFamily: T.fontDisplay, fontSize: 18, color: T.fg, marginBottom: 8, fontWeight: T.displayWeight }}>{verdict}</div>
      <div style={{ fontFamily: T.fontBody, fontSize: 12.5, color: T.muted, lineHeight: 1.5 }}>
        {atBed < 30
          ? "Caffeine should be cleared by bedtime."
          : atBed < 80
            ? "Some caffeine lingering — deep sleep may be reduced."
            : atBed < 150
              ? "Significant caffeine at bedtime. Try a 6h cutoff next time."
              : "Sleep will be fragmented. Cut caffeine 6h before bed."}
      </div>
    </div>
  );
}

function HistoryView({ entries }) {
  const [range, setRange] = useState('week');
  const week = useMemo(() => {
    const w = makeWeekHistory();
    const todayTotal = entries.reduce((s, e) => s + e.mg, 0);
    w[w.length - 1] = { ...w[w.length - 1], mg: todayTotal };
    return w;
  }, [entries]);
  const month = useMemo(() => makeMonthHistory(), []);
  const data = range === 'week' ? week : month;
  const labels = data.map(d => d.day || d.week);
  const values = data.map(d => d.mg);
  const avg = Math.round(values.reduce((s, v) => s + v, 0) / values.length);
  const max = Math.max(400, ...values) * 1.1;
  const last = values[values.length - 1];
  const prev = values[values.length - 2];
  const delta = last - prev;

  const TOP = [
    { id: 'drip', count: 8, mg: 760 },
    { id: 'cold-brew', count: 4, mg: 800 },
    { id: 'cappuccino', count: 5, mg: 375 },
    { id: 'matcha', count: 3, mg: 210 },
  ];

  const [chartRef, chartW] = useElementWidth([range]);
  const W = chartW || 820, H = 320;
  const padBot = 30, padTop = 10;
  const n = data.length;
  const barW = (W - 4) / n - 12;

  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.7fr) minmax(0,1fr)', gap: 24, alignItems: 'start' }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
        <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 28 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 22 }}>
            <div>
              <DLabel>{range === 'week' ? '7-day average' : '4-week average'}</DLabel>
              <div style={{ fontFamily: T.fontDisplay, fontSize: 48, color: T.fg, fontWeight: T.displayWeight, marginTop: 6, lineHeight: 1 }}>
                {avg}<span style={{ fontFamily: T.fontMono, fontSize: 13, color: T.muted, marginLeft: 6 }}>mg/day</span>
              </div>
              <div style={{ fontFamily: T.fontMono, fontSize: 12, marginTop: 8, color: delta >= 0 ? T.warn : T.ok, letterSpacing: '0.04em' }}>{delta >= 0 ? '+' : ''}{delta} mg vs prior</div>
            </div>
            <div style={{ display: 'inline-flex', background: T.track, padding: 3, borderRadius: T.radius }}>
              {['week', 'month'].map(r => (
                <button key={r} onClick={() => setRange(r)} style={{ padding: '8px 16px', border: 'none', cursor: 'pointer', background: range === r ? T.bg : 'transparent', color: range === r ? T.fg : T.muted, fontFamily: T.fontMono, fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', borderRadius: T.radius }}>{r === 'week' ? 'This week' : 'This month'}</button>
              ))}
            </div>
          </div>
          <div ref={chartRef}>
            {chartW > 0 && (
              <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: 'block', width: '100%' }}>
                {(() => {
                  const y = padTop + (1 - 400 / max) * (H - padTop - padBot);
                  return (
                    <g>
                      <line x1="0" x2={W} y1={y} y2={y} stroke={T.danger} strokeOpacity="0.4" strokeDasharray="2 4" strokeWidth="1" />
                      <text x={W} y={y - 6} textAnchor="end" fill={T.danger} fillOpacity="0.7" fontSize="11" fontFamily={T.fontMono} letterSpacing="0.06em">400 MG · DAILY MAX</text>
                    </g>
                  );
                })()}
                {data.map((d, i) => {
                  const v = d.mg;
                  const h = (v / max) * (H - padTop - padBot);
                  const x = 2 + i * ((W - 4) / n) + 6;
                  const y = H - padBot - h;
                  const isLast = i === data.length - 1;
                  const fill = v > 400 ? T.danger : (isLast ? T.accent : T.bar);
                  return (
                    <g key={i}>
                      <rect x={x} y={y} width={barW} height={h} rx={1} fill={fill} opacity={isLast ? 1 : 0.85} />
                      <text x={x + barW/2} y={H - 12} textAnchor="middle" fill={isLast ? T.fg : T.muted} fontSize="11" fontFamily={T.fontMono} letterSpacing="0.08em">{labels[i].toUpperCase()}</text>
                      <text x={x + barW/2} y={y - 8} textAnchor="middle" fill={T.muted} fontSize="10" fontFamily={T.fontMono} letterSpacing="0.04em" opacity={h > 22 ? 1 : 0}>{v}</text>
                    </g>
                  );
                })}
              </svg>
            )}
          </div>
        </div>
        <CoachBanner entries={entries} />
      </div>
      <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 0 }}>
        <div style={{ padding: '20px 22px 12px', borderBottom: T.divider }}>
          <DLabel>Most logged · 7 days</DLabel>
        </div>
        {TOP.map((t, i) => {
          const d = DRINK_BY_ID[t.id];
          return (
            <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 22px', borderBottom: i < TOP.length - 1 ? T.divider : 'none' }}>
              <div style={{ color: T.accent, flexShrink: 0 }}><DrinkGlyph cat={d.cat} size={22} /></div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: T.fontBody, fontSize: 13.5, color: T.fg, fontWeight: 500, marginBottom: 3 }}>{d.name}</div>
                <div style={{ fontFamily: T.fontMono, fontSize: 11, color: T.muted, letterSpacing: '0.04em' }}>{t.count} drinks · {t.mg} mg total</div>
              </div>
              <div style={{ fontFamily: T.fontDisplay, fontSize: 18, color: T.fg, fontWeight: T.displayWeight }}>#{i+1}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SleepView({ entries, now }) {
  const [bedHour, setBedHour] = useState(23);
  const bedtime = useMemo(() => {
    const d = new Date(now);
    d.setHours(bedHour, 0, 0, 0);
    if (d.getTime() < now) d.setDate(d.getDate() + 1);
    return d.getTime();
  }, [now, bedHour]);
  const atBed = Math.round(activeAt(entries, bedtime));
  const safeAt = timeBelow(entries, 50, now);

  let verdict, color, msg;
  if (atBed < 30) {
    verdict = "You'll sleep fine."; color = T.ok;
    msg = "Caffeine is mostly cleared by bedtime.";
  } else if (atBed < 80) {
    verdict = "Light sleep risk."; color = T.warn;
    msg = "Some caffeine lingering. Deep sleep may be reduced.";
  } else if (atBed < 150) {
    verdict = "Expect rough sleep."; color = T.warn;
    msg = "Significant caffeine at bedtime. Try wrapping earlier tomorrow.";
  } else {
    verdict = "Wired."; color = T.danger;
    msg = "Sleep will be fragmented. Cut caffeine 6+ hours before bed.";
  }
  function formatHour(h) {
    let hh = h % 24;
    if (hh === 0 || hh === 24) return '12:00 am';
    if (hh === 12) return '12:00 pm';
    const ap = hh >= 12 ? 'pm' : 'am';
    if (hh > 12) hh = hh - 12;
    return `${hh}:00 ${ap}`;
  }
  const [curveRef, curveW] = useElementWidth();
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.7fr) minmax(0,1fr)', gap: 24, alignItems: 'start' }}>
      <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 28 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 28, marginBottom: 22, flexWrap: 'wrap' }}>
          <div style={{ minWidth: 0 }}>
            <DLabel>Caffeine in body at {formatHour(bedHour)}</DLabel>
            <div style={{ fontFamily: T.fontDisplay, fontSize: 56, color, fontWeight: T.displayWeight, marginTop: 6, lineHeight: 1, fontFeatureSettings: '"tnum"' }}>
              {atBed}<span style={{ fontFamily: T.fontMono, fontSize: 14, color: T.muted, marginLeft: 6, letterSpacing: '0.04em' }}>mg</span>
            </div>
            <div style={{ fontFamily: T.fontDisplay, fontSize: 22, color: T.fg, marginTop: 10, fontWeight: T.displayWeight }}>{verdict}</div>
            <div style={{ fontFamily: T.fontBody, fontSize: 13.5, color: T.muted, marginTop: 6, lineHeight: 1.5, maxWidth: 460 }}>{msg}</div>
          </div>
          <div style={{ width: 280 }}>
            <DLabel style={{ marginBottom: 10 }}>Bedtime · {formatHour(bedHour)}</DLabel>
            <input type="range" min="20" max="27" step="1" value={bedHour} onChange={e => setBedHour(+e.target.value)} style={{ width: '100%', accentColor: T.accent }} />
            <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: T.fontMono, fontSize: 10, color: T.muted, marginTop: 4 }}>
              <span>8p</span><span>10p</span><span>12a</span><span>3a</span>
            </div>
          </div>
        </div>
        <div ref={curveRef}>
          {curveW > 0 && <DecayCurve entries={entries} now={now} width={curveW} height={200} />}
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
        <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 20 }}>
          <DLabel>Sleep-safe at</DLabel>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 36, color: T.fg, fontWeight: T.displayWeight, marginTop: 8, lineHeight: 1 }}>{safeAt ? fmtTime(safeAt) : '—'}</div>
          <div style={{ fontFamily: T.fontBody, fontSize: 12, color: T.muted, marginTop: 8, lineHeight: 1.5 }}>When your active dose drops below 50 mg.</div>
        </div>
        <div style={{ background: T.card, border: T.cardBorder, borderRadius: T.radius, padding: 20 }}>
          <DLabel>Half-life</DLabel>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 36, color: T.fg, fontWeight: T.displayWeight, marginTop: 8, lineHeight: 1 }}>~5h</div>
          <div style={{ fontFamily: T.fontBody, fontSize: 12, color: T.muted, marginTop: 8, lineHeight: 1.5 }}>Half of what you drink now is still in you 5 hours later.</div>
        </div>
      </div>
    </div>
  );
}

function DesktopApp({ entries, addEntry, removeEntry, updateEntryTime, waters, addWater, removeWater, updateWaterTime, now, setBrowseOpen, setPendingDrink }) {
  const [tab, setTab] = useState('today');
  const greeting = (() => {
    const h = new Date(now).getHours();
    if (h < 5) return "Late one";
    if (h < 12) return "Good morning";
    if (h < 17) return "Good afternoon";
    if (h < 21) return "Good evening";
    return "Up late";
  })();
  return (
    <div style={{ width: '100%', minHeight: '100vh', background: T.bg, color: T.fg, fontFamily: T.fontBody }}>
      <TopNav tab={tab} onTab={setTab} now={now} />
      <div style={{ padding: '32px 32px 48px', maxWidth: 1600, margin: '0 auto' }}>
        <div style={{ marginBottom: 28, display: 'flex', alignItems: 'baseline', gap: 16, flexWrap: 'wrap' }}>
          <h1 style={{ margin: 0, fontFamily: T.fontDisplay, fontSize: 32, color: T.fg, fontWeight: T.displayWeight, letterSpacing: T.displayTracking }}>
            {tab === 'today' ? greeting : tab === 'history' ? 'History' : 'Sleep forecast'}
          </h1>
          <span style={{ fontFamily: T.fontMono, fontSize: 12, color: T.muted, letterSpacing: '0.08em' }}>{new Date(now).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</span>
        </div>

        {tab === 'today' && (
          <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.7fr) minmax(0,1fr)', gap: 24, alignItems: 'start' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 24, minWidth: 0 }}>
              <HeroGraph entries={entries} now={now} />
              <CoachBanner entries={entries} />
              <TodayLogDesktop entries={entries} removeEntry={removeEntry} updateEntryTime={updateEntryTime} waters={waters} removeWater={removeWater} updateWaterTime={updateWaterTime} />
              <StatsStrip entries={entries} />
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
              <HydroCard waters={waters} addWater={addWater} />
              <QuickLogDesktop onPick={setPendingDrink} onBrowse={() => setBrowseOpen(true)} columns={2} />
              <ThisWeekCard entries={entries} />
              <SleepCard entries={entries} now={now} />
            </div>
          </div>
        )}
        {tab === 'history' && <HistoryView entries={entries} />}
        {tab === 'sleep' && <SleepView entries={entries} now={now} />}
      </div>
    </div>
  );
}

function App() {
  const isDesktop = useIsDesktop();
  const [entries, setEntries] = useState(loadEntries);
  const [waters, setWaters] = useState(loadWaters);
  const [browseOpen, setBrowseOpen] = useState(false);
  const [pendingDrink, setPendingDrink] = useState(null);
  const now = useLiveNow();

  const addEntry = (drinkId, amount = 1) => {
    const d = DRINK_BY_ID[drinkId];
    const next = [...entries, { id: 'e' + Date.now(), drink: drinkId, amount, mg: Math.round(d.mg * amount), kcal: Math.round(d.kcal * amount), time: Date.now() }];
    setEntries(next); saveEntries(next);
  };
  const removeEntry = id => {
    const next = entries.filter(e => e.id !== id);
    setEntries(next); saveEntries(next);
  };
  const updateEntryTime = (id, timeStr) => {
    const [h, m] = timeStr.split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    const next = entries.map(e => e.id === id ? { ...e, time: d.getTime() } : e);
    setEntries(next); saveEntries(next);
  };
  const addWater = () => {
    const t = Date.now();
    const lastCoffee = entries.length ? Math.max(...entries.map(e => e.time)) : -Infinity;
    const lastWater = waters.length ? Math.max(...waters.map(w => w.time)) : -Infinity;
    const bonus = lastCoffee > lastWater && lastCoffee !== -Infinity;
    const rec = { id: 'w' + t, time: t, bonus };
    const next = [...waters, rec];
    setWaters(next); saveWaters(next);
    return rec;
  };
  const removeWater = id => {
    const next = waters.filter(w => w.id !== id);
    setWaters(next); saveWaters(next);
  };
  const updateWaterTime = (id, timeStr) => {
    const [h, m] = timeStr.split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    const next = waters.map(w => w.id === id ? { ...w, time: d.getTime() } : w);
    setWaters(next); saveWaters(next);
  };

  const shared = { entries, addEntry, removeEntry, updateEntryTime, waters, addWater, removeWater, updateWaterTime, now, setBrowseOpen, setPendingDrink };

  return (
    <>
      {isDesktop ? <DesktopApp {...shared} /> : <MobileApp {...shared} />}
      <Browse open={browseOpen} onClose={() => setBrowseOpen(false)} onPick={setPendingDrink} isDesktop={isDesktop} />
      <AmountPicker open={pendingDrink !== null} drinkId={pendingDrink} onClose={() => setPendingDrink(null)} onConfirm={addEntry} isDesktop={isDesktop} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
